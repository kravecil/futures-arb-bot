[project]
name = "futures-arb-bot"
version = "2.0.0"
description = "Межбиржевой арбитражный робот для бессрочных фьючерсов (CCXT)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "ccxt>=4.5.85",
    "rich>=15.0.0",
    "pyfiglet>=1.0.4",
    "pyyaml>=6.0.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "aiohttp>=3.14.5",
]

[project.scripts]
futures-arb-bot = "futures_arb_bot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", # кириллица в строках — это нормально
    "RUF002",
    "RUF003",
    "SIM105",
    "SIM108", # тернарник не всегда читаемее
]
