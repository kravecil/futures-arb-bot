# Общие настройки и арбитраж (перенос appsettings.json).
# Секреты — в .env (ARB_…), варианты значений: DryRun | Testnet | Live.

General:
  NetworkMode: live
  RefreshIntervalMs: 500
  WriteLogFile: true
  ConsoleUi:
    RefreshMs: 400
    LogLines: 9
    TopRows: 12

Arbitrage:
  Enabled: true
  AllowLive: true
  MinSpreadPercentUp: 0.5
  MinSpreadPercentDown: 0.4
  StopLossSpreadPercent: 1
  SlippageBufferPercent: 0.03
  MaxSpreadPercent: 5.0
  MinFundingRatePercent: -1.0
  IncludeFees: true
  OrderSizeUsd: 6
  OrderExecutionTimeoutMs: 2000
  OrderPollIntervalMs: 200
  RebalanceTolerancePercent: 1.0
  # Необязательный раздел: как именно выставляются заявки. Пустой/отсутствующий = историческое
  # поведение (marketable limit на входе, market на закрытии). Type: Market | Limit | ChaseLimit;
  # LimitOffsetBps — смещение цены от котировки в bps (1 bps = 0.01%);
  # TimeInForce: GTC | IOC | FOK | PostOnly; Close — отдельная политика закрытия
  # (Chase там не допускается). Догонание настраивается подсекцией Chase:
  # { Mode: Simulated | Native, MaxSteps, StepIntervalMs, StepBps, MaxDeviationBps,
  #   FallbackToMarket, Params } — см. README.
  Execution:
    Type: ChaseLimit
    LimitOffsetBps: 35
    TimeInForce: GTC
    Close:
      Type: Limit
  Leverage: 5
  MaxOpenPositions: 2
  MaxPositionsPerExchange: 2
  MaxPositionAgeMinutes: 720
  ClosePositionsOnExit: true
