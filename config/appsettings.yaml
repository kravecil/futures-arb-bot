# Общие настройки и арбитраж.
# Любое значение можно переопределить переменной окружения (в том числе из .env):
#   ARB_<РАЗДЕЛ>__<КЛЮЧ>, например ARB_ARBITRAGE__ENABLED=false или ARB_GENERAL__NETWORK_MODE=dry_run.
# Регистр и подчёркивания в именах ключей не важны (NetworkMode = network_mode).
# Файл перечитывается на лету: большинство изменений применяется без перезапуска.

general:
  network_mode: live            # DryRun | Testnet | Live
  refresh_interval_ms: 500      # период опроса REST, мс (не меньше 500)
  write_log_file: true          # журнал сеанса в logs/session-*.log
  market_data:
    source: WebSocket           # WebSocket | Rest
    scan_interval_ms: 100       # WebSocket: как часто пересчитывать спреды по свежим котировкам
    stale_after_ms: 3000        # поток молчит дольше — котировки биржи по REST (раз в refresh_interval_ms)
    volume_refresh_seconds: 60  # обновление оборотов за 24 ч и набора подписок по REST
    reconnect_after_ms: 5000    # поток молчит дольше — сбросить соединение и открыть заново (0 — не вмешиваться)
    keep_alive_ms: 15000        # период ping-pong WebSocket ccxt (0 — как в ccxt, у OKX/Bybit 18 с); при 5000 — десятки ложных обрывов (19.10)
    spread_report_seconds: 60   # раз в N с писать в журнал лучшие спреды за период (0 — не писать)
    spread_report_top: 5        # сколько лучших связок в этом отчёте
  orders:
    updates: WebSocket          # статусы своих заявок: WebSocket (watch_orders, с проверкой REST) | Rest (опрос)
    transport: WebSocket        # выставление/отмена: WebSocket (create/cancel_order_ws, где есть в ccxt) | Rest
    max_cache_age_ms: 1000      # статус из потока без изменений дольше — перепроверка запросом REST
  console_ui:
    refresh_ms: 400             # период перерисовки дашборда
    log_lines: 9                # строк журнала в панели (1..50)
    top_rows: 12                # строк в таблице лучших возможностей

arbitrage:
  enabled: true                 # false — только мониторинг спредов
  allow_live: true              # страховка: Live + торговля требует явного true
  min_spread_percent_up: 0.4    # порог входа (нетто, %)
  min_spread_percent_down: 0.3  # порог фиксации прибыли (%)
  stop_loss_spread_percent: 3   # стоп-лосс (%)
  slippage_buffer_percent: 0.03
  max_spread_percent: 5.0       # спреды выше — аномалия, игнорируются
  min_funding_rate_percent: -0.3
  include_fees: true
  order_size_usd: 12             # номинал каждой ноги, USDT
  order_execution_timeout_ms: 2000
  order_poll_interval_ms: 200
  rebalance_tolerance_percent: 1.0

  # Необязательный раздел: как именно выставляются заявки. Пустой/отсутствующий —
  # историческое поведение (marketable limit на входе, market на закрытии).
  #   type: Market | Limit | ChaseLimit
  #   limit_offset_bps: смещение цены от котировки в bps (1 bps = 0.01 %)
  #   time_in_force: GTC | IOC | FOK | PostOnly
  #   close: отдельная политика закрытия (Chase там не допускается)
  #   chase: { mode: Simulated | Native, max_steps, step_interval_ms, step_bps,
  #            max_deviation_bps, fallback_to_market, params } — см. README.
  execution:
    type: Market
    limit_offset_bps: 35
    time_in_force: IOC
    close:
      type: Market

  leverage: 5
  max_open_positions: 2
  max_positions_per_exchange: 2
  max_position_age_minutes: 720
  close_positions_on_exit: true

  # Защита входа от фантомных спредов (устаревшая котировка одной из бирж):
  confirm_scans: 2              # спред должен продержаться столько сканов подряд (1 — входить сразу)
  confirm_order_book: true      # перед входом перепроверить спред по стаканам обеих бирж (REST)
  order_book_depth: 20          # уровней стакана для проверки
  order_book_timeout_ms: 1500   # стаканы не пришли за это время — сделка не открывается

  # Защита выхода (разбор 19.10.2026: CT закрывался тейк-профитом через 0–8 с по скачку котировки и уходил в минус):
  exit_confirm_scans: 2           # условие TP/SL должно продержаться столько сканов подряд (1 — закрывать сразу)
  min_exit_profit_percent: 0.15   # TP только если расчётный PnL выхода не ниже этого (%, после комиссий)
  exit_confirm_order_book: true   # перед TP перепроверить PnL выхода по стаканам обеих бирж (REST)
  exit_max_quote_age_ms: 3000     # котировка ноги старше — TP откладывается (стоп-лосс не блокируется; 0 — не проверять)
  reentry_cooldown_seconds: 300   # после закрытия не входить в тот же символ столько секунд
  stop_loss_cooldown_seconds: 1800  # после стоп-лосса — столько секунд (0 — как reentry_cooldown_seconds)
